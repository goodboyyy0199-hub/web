<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dashboard</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card" id="card">
    <p class="muted">กำลังโหลด...</p>
  </main>
  <script>
    const card = document.getElementById('card');

    // ใส่ข้อความแบบปลอดภัย (ไม่ใช้ innerHTML กับข้อมูลจากผู้ใช้)
    function el(tag, props = {}, text) {
      const n = document.createElement(tag);
      Object.assign(n, props);
      if (text !== undefined) n.textContent = text;
      return n;
    }
    function row(label, value) {
      const li = el('li');
      li.append(el('span', {}, label), el('b', {}, value));
      return li;
    }

    fetch('/api/me')
      .then((r) => {
        if (!r.ok) { location.replace('/'); return null; }
        return r.json();
      })
      .then((u) => {
        if (!u) return;
        card.replaceChildren(
          el('img', { className: 'avatar', src: u.avatar, alt: 'avatar' }),
          el('h1', {}, `สวัสดี ${u.globalName || u.username} 👋`),
          el('p', { className: 'muted' }, `@${u.username}`),
          (() => {
            const ul = el('ul', { className: 'info' });
            ul.append(row('Discord ID', u.id), row('อีเมล', u.email || '-'));
            return ul;
          })(),
          el('a', { className: 'btn out', href: '/logout' }, 'ออกจากระบบ')
        );
      })
      .catch(() => location.replace('/'));
  </script>
</body>
</html>
