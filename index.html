<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>เข้าสู่ระบบ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="card">
    <h1>ยินดีต้อนรับ</h1>
    <p class="muted">เข้าสู่ระบบด้วยบัญชี Discord ของคุณ</p>
    <p id="err" class="error" hidden></p>
    <a class="btn" href="https://discord.com/oauth2/authorize?client_id=1565002100205948990&response_type=code&redirect_uri=https%3A%2F%2Fpoboxpvp.vercel.app%2Fcallback&scope=identify+email">
      <svg width="22" height="22" viewBox="0 0 127.14 96.36" fill="currentColor" aria-hidden="true"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg>
      ล็อคอินด้วย Discord
    </a>
  </main>
  <script>
    // ถ้าล็อคอินอยู่แล้ว ข้ามไปหน้า dashboard
    fetch('/api/me').then((r) => { if (r.ok) location.replace('/dashboard'); }).catch(() => {});

    const e = new URLSearchParams(location.search).get('error');
    if (e) {
      const el = document.getElementById('err');
      el.hidden = false;
      el.textContent = e === 'denied' ? 'คุณยกเลิกการอนุญาต' : 'ล็อคอินไม่สำเร็จ ลองใหม่อีกครั้ง';
    }
  </script>
</body>
</html>
